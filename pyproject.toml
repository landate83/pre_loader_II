[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pointcloud-converter"
version = "0.1.0"
description = "CLI utility for converting point clouds (.ply/.sog) to GLB/Draco with compression"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "landate" }
]

dependencies = [
  "numpy>=1.24.0",
  "plyfile>=1.0.0",
  "pygltflib>=1.16.0",
  "click>=8.0.0"
]

[project.scripts]
pc2glb = "converter.cli:main"

[tool.setuptools]
packages = ["converter"]
